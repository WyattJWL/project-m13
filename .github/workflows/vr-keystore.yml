# Génère UNE FOIS la clé de signature de l'application (keystore de release).
# Résultat : artefact « vr-keystore » (keystore.b64 + password.txt) à copier dans les secrets du dépôt :
#   VR_KEYSTORE_B64      = contenu de keystore.b64
#   VR_KEYSTORE_PASSWORD = contenu de password.txt
# Puis SUPPRIMER l'artefact. Cette clé doit être conservée : Meta exige la même pour chaque mise à jour.
name: Créer la clé de signature VR

on:
  workflow_dispatch:
  push:
    branches: ["claude/m13-second-book-**"]
    paths: [".github/workflows/vr-keystore.yml"]

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le keystore
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore release.keystore -alias projectm13 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Siroxtag,O=Project-M13,C=FR" -deststoretype pkcs12
          base64 -w0 release.keystore > keystore.b64
          printf '%s' "$PASS" > password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vr-keystore
          path: |
            keystore.b64
            password.txt
          retention-days: 1
