# Compile l'APK de test PROJECT-M13 VR (Meta Quest) avec Godot + OpenXR Vendors.
# Résultat : artefact « project-m13-vr-apk » (APK signé avec une clé de debug jetable, installable sur Quest).
name: Build VR APK

on:
  workflow_dispatch:
  push:
    branches: ["claude/m13-second-book-**"]
    paths: ["vr/**", ".github/workflows/vr-apk.yml"]

env:
  GODOT_VERSION: "4.6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Godot (modèles d'export, réglages Android)
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/ || true
          cp /root/.config/godot/editor_settings* ~/.config/godot/ 2>/dev/null || true
          ls ~/.local/share/godot/export_templates || true
          ls ~/.config/godot || true
          echo "ANDROID_SDK: ${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"

      - name: Télécharger le plugin Meta Quest (Godot OpenXR Vendors)
        working-directory: vr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq jq unzip curl >/dev/null
          curl -sH "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/GodotVR/godot_openxr_vendors/releases/latest > /tmp/rel.json
          jq -r '.tag_name, (.assets[].name)' /tmp/rel.json
          URL=$(jq -r '[.assets[] | select(.name | test("symbols") | not) | select(.name | test("\\.zip$"))] | (map(select(.name | test("release"))) + .)[0].browser_download_url' /tmp/rel.json)
          echo "Plugin: $URL"
          curl -sL "$URL" -o /tmp/vendors.zip
          mkdir -p /tmp/tmp_vendors && unzip -q /tmp/vendors.zip -d /tmp/tmp_vendors
          mkdir -p addons
          SRC=$(find /tmp/tmp_vendors -type d -name godotopenxrvendors | head -1)
          cp -r "$SRC" addons/
          ls addons/godotopenxrvendors | head
          echo '--- options Meta du plugin ---'
          grep -rhoE '"meta_xr_features/[a-z_0-9]+"|supportedDevices[^"]*' addons/godotopenxrvendors/editor 2>/dev/null | sort -u | head -40 | tee /tmp/opts.txt

      - name: Installer le modèle de build Android
        working-directory: vr
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Clé de debug jetable
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Importer le projet
        working-directory: vr
        run: godot --headless --import || true

      - name: Vérifier les scripts (erreurs de syntaxe)
        working-directory: vr
        run: |
          # « Settings » est un autoload : inconnu en mode vérification seule, on le remplace dans une copie.
          rm -rf /tmp/vrcheck && cp -r . /tmp/vrcheck && cd /tmp/vrcheck
          for f in scripts/*.gd scripts/ch/*.gd; do
            [ "$f" = "scripts/settings.gd" ] || sed -i 's#\bSettings\.#(preload("res://scripts/settings.gd").new()).#g' "$f"
          done
          FAIL=0
          for f in scripts/*.gd scripts/ch/*.gd; do
            OUT=$(godot --headless --path . --check-only --script "res://$f" 2>&1 || true)
            BAD=$(echo "$OUT" | grep -E "SCRIPT ERROR|Parse Error|Compile Error|Cannot|not declared|Expected|Invalid|Unexpected" | head -8)
            if [ -n "$BAD" ]; then echo "=== $f ==="; echo "$BAD"; FAIL=1; fi
          done
          exit $FAIL

      - name: Exporter l'APK
        working-directory: vr
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Quest" build/project-m13-vr.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: project-m13-vr-apk
          path: vr/build/project-m13-vr.apk

      - name: Publier l'APK sur la branche vr-apk-build (téléchargement direct)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/apk && cp vr/build/project-m13-vr.apk /tmp/apk/
          git checkout --orphan vr-apk-build
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/apk/project-m13-vr.apk .
          cp /tmp/opts.txt options.txt 2>/dev/null || true
          git add options.txt 2>/dev/null || true
          git add project-m13-vr.apk
          git commit -qm "APK VR ${GITHUB_SHA}"
          git push -f origin vr-apk-build
