# APK de RELEASE signé (pour le Meta Quest Store / canal de test). Lancement manuel.
# Secrets requis : VR_KEYSTORE_B64 (keystore en base64), VR_KEYSTORE_PASSWORD. Voir vr/STORE.md.
name: Build VR APK (release)

on:
  workflow_dispatch:
  push:
    branches: ["claude/m13-second-book-**"]
    paths: ["vr/RELEASE_TRIGGER"]

env:
  GODOT_VERSION: "4.6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Godot (modèles d'export, réglages Android)
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/ || true
          cp /root/.config/godot/editor_settings* ~/.config/godot/ 2>/dev/null || true
          ls ~/.local/share/godot/export_templates || true
          ls ~/.config/godot || true
          echo "ANDROID_SDK: ${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"

      - name: Télécharger le plugin Meta Quest (Godot OpenXR Vendors)
        working-directory: vr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq jq unzip curl >/dev/null
          curl -sH "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/GodotVR/godot_openxr_vendors/releases/latest > /tmp/rel.json
          jq -r '.tag_name, (.assets[].name)' /tmp/rel.json
          URL=$(jq -r '[.assets[] | select(.name | test("symbols") | not) | select(.name | test("\\.zip$"))] | (map(select(.name | test("release"))) + .)[0].browser_download_url' /tmp/rel.json)
          echo "Plugin: $URL"
          curl -sL "$URL" -o /tmp/vendors.zip
          mkdir -p /tmp/tmp_vendors && unzip -q /tmp/vendors.zip -d /tmp/tmp_vendors
          mkdir -p addons
          SRC=$(find /tmp/tmp_vendors -type d -name godotopenxrvendors | head -1)
          cp -r "$SRC" addons/
          ls addons/godotopenxrvendors | head
          echo '--- options Meta du plugin ---'
          grep -rhoE '"meta_xr_features/[a-z_0-9]+"|supportedDevices[^"]*' addons/godotopenxrvendors/editor 2>/dev/null | sort -u | head -25

      - name: Installer le modèle de build Android
        working-directory: vr
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Déclarer les casques compatibles (exigé par Meta)
        working-directory: vr
        run: |
          F=android/build/AndroidManifest.xml
          grep -q "com.oculus.supportedDevices" "$F" || sed -i 's#</application>#    <meta-data android:name="com.oculus.supportedDevices" android:value="quest2|questpro|quest3|quest3s" />\n    </application>#' "$F"
          grep -n "supportedDevices" "$F" || echo "ATTENTION : balise non ajoutée"

      - name: Keystore de release (depuis les secrets)
        env:
          KS_B64: ${{ secrets.VR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Secrets VR_KEYSTORE_B64 / VR_KEYSTORE_PASSWORD manquants (voir vr/STORE.md)."; exit 1; fi
          echo "$KS_B64" | base64 -d > /tmp/release.keystore

      - name: Importer le projet
        working-directory: vr
        run: godot --headless --import || true

      - name: Exporter l'APK de release
        working-directory: vr
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: projectm13
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --verbose --export-release "Quest" build/project-m13-vr-release.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: project-m13-vr-release-apk
          path: vr/build/project-m13-vr-release.apk

      - name: Publier l'APK sur la branche vr-apk-release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/apk && cp vr/build/project-m13-vr-release.apk /tmp/apk/
          git checkout --orphan vr-apk-release
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/apk/project-m13-vr-release.apk .
          git add project-m13-vr-release.apk
          git commit -qm "APK VR release ${GITHUB_SHA}"
          git push -f origin vr-apk-release
