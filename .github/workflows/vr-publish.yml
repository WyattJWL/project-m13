# Envoie l'APK release sur Meta Quest avec ovr-platform-util (autorisé explicitement par le propriétaire).
# Secrets : META_APP_SECRET (clé secrète de l'app) et/ou META_USER_TOKEN. L'ID d'app n'est pas secret.
name: Publier sur Meta Quest

on:
  workflow_dispatch:
  push:
    branches: ["claude/m13-second-book-**"]
    paths: ["vr/PUBLISH_TRIGGER"]

env:
  META_APP_ID: "25450761214510188"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l'APK release
        run: |
          git clone --depth 1 --branch vr-apk-release "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/rel
          ls -la /tmp/rel

      - name: Télécharger ovr-platform-util
        run: |
          for URL in "https://developers.meta.com/horizon/resources/publish-reference-platform-command-line-utility/" "https://developer.oculus.com/resources/publish-reference-platform-command-line-utility/"; do
            curl -sL -m 30 "$URL" -o /tmp/page.html || true
            LINK=$(grep -oE 'https://www\.oculus\.com/download_app/\?id=[0-9]+(&|&amp;)access_token=[^"'"'"' <]+' /tmp/page.html | head -1 | sed 's/&amp;/\&/g')
            [ -n "$LINK" ] && break
          done
          echo "page: $(wc -c < /tmp/page.html) octets ; lien trouvé : ${LINK:+oui}"
          [ -n "$LINK" ] || { echo "Lien de téléchargement d'ovr-platform-util introuvable dans la page Meta."; exit 1; }
          curl -sL "$LINK" -o /tmp/ovr-platform-util
          chmod +x /tmp/ovr-platform-util
          /tmp/ovr-platform-util version || /tmp/ovr-platform-util help | head -5

      - name: Envoyer le build (LIVE puis ALPHA ; clé secrète puis token utilisateur)
        env:
          APP_SECRET: ${{ secrets.META_APP_SECRET }}
          USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: |
          mask() { sed -E "s/(secret|token)[= ][^ ]+/\1=***/Ig"; }
          APP_SECRET="${APP_SECRET##*|}"   # accepte « OC|id|secret » ou le secret seul
          echo "longueurs : secret=${#APP_SECRET} token=${#USER_TOKEN}"
          for MODE in secret token; do
            if [ "$MODE" = "secret" ]; then [ -n "$APP_SECRET" ] || continue; AUTH=(--app_secret "$APP_SECRET"); else [ -n "$USER_TOKEN" ] || continue; AUTH=(--token "$USER_TOKEN"); fi
            for CH in LIVE ALPHA; do
              echo "=== $MODE / canal $CH ==="
              /tmp/ovr-platform-util upload-quest-build --app_id "$META_APP_ID" "${AUTH[@]}" --apk /tmp/rel/project-m13-vr-release.apk --channel "$CH" 2>&1 | mask | tee /tmp/out.txt
              if grep -qiE "success|uploaded" /tmp/out.txt && ! grep -qi "error" /tmp/out.txt; then echo "ENVOYE"; exit 0; fi
            done
          done
          echo "Echec de l'envoi."; exit 1
